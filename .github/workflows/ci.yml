name: Selenium CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:
    inputs:
      report:
        description: Select report provider
        required: true
        type: choice
        options:
          - allure
          - extent
        default: allure

      suiteXmlFile:
        description: 'TestNG suite XML path (leave empty for automatic discovery)'
        required: false
        type: string
        default: ''

      platform:
        description: Platform
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: Headless mode
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      timeout:
        description: Timeout in milliseconds
        required: true
        default: 5000
        type: number

      pageLoadTimeout:
        description: Page load timeout in milliseconds
        required: true
        default: 30000
        type: number

      pollingInterval:
        description: Polling interval in milliseconds
        required: true
        default: 200
        type: number

permissions:
  contents: read

concurrency:
  group: selenium-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      REPORT: ${{ inputs.report || 'allure' }}
      PLATFORM: ${{ inputs.platform || 'chrome' }}
      HEADLESS: ${{ inputs.headless || 'true' }}
      TIMEOUT: ${{ inputs.timeout || 5000 }}
      PAGE_LOAD_TIMEOUT: ${{ inputs.pageLoadTimeout || 30000 }}
      POLLING_INTERVAL: ${{ inputs.pollingInterval || 200 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Discover TestNG suite
        id: suite
        shell: bash
        env:
          REQUESTED_SUITE: ${{ inputs.suiteXmlFile }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_SUITE" ]; then
            if [ ! -f "$REQUESTED_SUITE" ]; then
              echo "::error::Suite file not found: $REQUESTED_SUITE"
              exit 1
            fi

            SUITE_FILE="$REQUESTED_SUITE"
          else
            SUITE_FILE=""

            mapfile -d '' XML_FILES < <(
              find . \
                -type d \( -name .git -o -name target \) -prune \
                -o -type f -iname '*.xml' -print0
            )

            SUITE_FILES=()

            for FILE in "${XML_FILES[@]}"; do
              if grep -Eq '<suite([[:space:]>])' "$FILE"; then
                SUITE_FILES+=("$FILE")
              fi
            done

            DEFAULT_SUITE="src/test/resources/suite/testng.xml"

            if [ -f "$DEFAULT_SUITE" ]; then
              SUITE_FILE="$DEFAULT_SUITE"
            elif [ "${#SUITE_FILES[@]}" -eq 1 ]; then
              SUITE_FILE="${SUITE_FILES[0]}"
            elif [ "${#SUITE_FILES[@]}" -eq 0 ]; then
              echo "::error::No TestNG suite XML was found."
              exit 1
            else
              echo "::error::Multiple TestNG suite XML files were found."
              echo "Specify suiteXmlFile using workflow_dispatch."
              printf '%s\n' "${SUITE_FILES[@]}"
              exit 1
            fi
          fi

          echo "file=${SUITE_FILE#./}" >> "$GITHUB_OUTPUT"
          echo "Using TestNG suite: $SUITE_FILE"

      - name: Run Selenium Tests
        shell: bash
        env:
          SUITE_XML_FILE: ${{ steps.suite.outputs.file }}
        run: |
          set -euo pipefail

          mvn --batch-mode --no-transfer-progress clean test \
            "-DsuiteXmlFile=${SUITE_XML_FILE}" \
            "-Dbrowser=${PLATFORM}" \
            "-Dreport=${REPORT}" \
            "-Dheadless=${HEADLESS}" \
            "-Dtimeout=${TIMEOUT}" \
            "-DpageLoadTimeout=${PAGE_LOAD_TIMEOUT}" \
            "-DpollingInterval=${POLLING_INTERVAL}"

      - name: Set up Node.js
        if: always() && env.REPORT == 'allure'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Allure CLI
        if: always() && env.REPORT == 'allure'
        run: npm install --global allure-commandline

      - name: Generate HTML Report
        id: report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p report-site

          if [ "$REPORT" = "allure" ]; then
            if [ -d allure-results ] &&
               find allure-results -type f -print -quit | grep -q .; then
              allure generate allure-results \
                --clean \
                --output report-site
            else
              echo "::warning::No Allure results found."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

          elif [ "$REPORT" = "extent" ]; then
            EXTENT_REPORT="test-output/ExtentReport/index.html"

            if [ -f "$EXTENT_REPORT" ]; then
              cp "$EXTENT_REPORT" report-site/index.html
            else
              echo "::warning::Extent HTML report was not found at $EXTENT_REPORT"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

          else
            echo "::error::Unsupported report provider: $REPORT"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Test Results and Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-results-${{ github.run_number }}
          path: |
            target/surefire-reports/
            test-output/
            allure-results/
            report-site/
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy Report to GitHub Pages
        id: deployment
        if: >-
          always() &&
          steps.report.outputs.ready == 'true' &&
          github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report-site
          destination_dir: runs/${{ github.run_number }}
          keep_files: true

      - name: Print Report URL
        if: steps.deployment.outcome == 'success'
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -n "$PAGES_URL" ]; then
            BASE_URL="${PAGES_URL%/}"
          else
            OWNER="${REPOSITORY%%/*}"
            REPO="${REPOSITORY#*/}"

            if [ "$REPO" = "${OWNER}.github.io" ]; then
              BASE_URL="https://${OWNER}.github.io"
            else
              BASE_URL="https://${OWNER}.github.io/${REPO}"
            fi
          fi

          echo "Report URL: ${BASE_URL}/runs/${RUN_NUMBER}/"
