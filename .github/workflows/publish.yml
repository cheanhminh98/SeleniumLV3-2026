name: Selenium - Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: selenium-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Framework Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - name: Verify environment
        run: |
          java -version
          mvn -version

      - name: Set release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            echo "Expected a tag such as v1.0.0 or 1.0.0"
            exit 1
          fi

          mvn --batch-mode versions:set \
            "-DnewVersion=${VERSION}" \
            -DgenerateBackupPoms=false

          echo "Publishing version: ${VERSION}"

      - name: Build and publish package
        run: mvn --batch-mode --no-transfer-progress clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
